name = "hhf-submit"
main = "index.js"
compatibility_date = "2024-09-23"

# The static front end. Only this origin may POST a photo -- the endpoint
# accepts image uploads from the public, so it does not get a wildcard.
[vars]
FRONTEND_ORIGIN = "https://paulrenzi.github.io"

# Menu photos, one object per submission. Private: nothing is served to the
# public, because an unreviewed submission is an arbitrary camera image from a
# stranger and must not become a URL anyone can hand around.
#
# R2 is not enabled on this account (the API refuses with "Please enable R2
# through the Cloudflare Dashboard", code 10042 -- it is a dashboard opt-in
# that adds a billing subscription, so it is Paul's call, not a deploy step).
# KV holds the photos instead; the Worker supports both and picks whichever
# binding exists. To move to R2: enable it, create the bucket, uncomment the
# r2_buckets block, copy any existing keys across, redeploy.
#
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "hhf-photos"
[[kv_namespaces]]
binding = "PHOTOS_KV"
id = "66b5eaaf6b094c64b8647a60ec0207af"

# Submission rows + the daily per-submitter counter.
[[d1_databases]]
binding = "DB"
database_name = "hhf"
database_id = "4acff9cc-d2e3-4130-acec-347652effe9d"

# Secrets, set with `wrangler secret put NAME` -- never in this file:
#   ADMIN_TOKEN      the review/extraction bearer, read by ingest/*.py
#   IP_SALT          salt for the submitter hash (rotating it resets rate limits)
#   TURNSTILE_SECRET optional; when set, /submit requires a Turnstile token
#   ANTHROPIC_API_KEY optional. When set, the Worker reads a menu photo itself
#                    the moment it is uploaded, and a clean read for a venue
#                    with no hours publishes through /live/deals.json within
#                    seconds. With it unset, nothing breaks: the reading waits
#                    for the HappyHourReadPhotos scheduled task on Paul's PC,
#                    which runs the  CLI on the Max subscription and
#                    costs nothing. A Max subscription is licensed for a
#                    person's own interactive use, not as a public backend --
#                    that is why this path is an API key and not a copied
#                    credentials file.
#
# Optional var (not a secret), set in [vars] or the dashboard:
#   VISION_MODEL     defaults to claude-sonnet-5. A menu photo is roughly 1.5k
#                    tokens in and 1k out, so about two cents a photo.
