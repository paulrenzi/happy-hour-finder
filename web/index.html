<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14100d">
<title>Happy Hour — King of Prussia</title>
<meta name="description" content="What's live right now around King of Prussia, and is the deal actually still on?">
<meta property="og:title" content="Happy Hour — King of Prussia">
<meta property="og:description" content="What's live right now around King of Prussia, and is the deal actually still on?">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preload" as="image" href="img/hero-taproom.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Collapses into a glass bar once the hero scrolls away. -->
<header id="bar">
  <span id="barTitle">Happy Hour</span>
  <span id="clock"></span>
</header>

<section id="hero">
  <img id="heroImg" src="img/hero-taproom.jpg" alt="" aria-hidden="true">
  <div id="heroInk">
    <p class="kicker">King of Prussia · 20 miles</p>
    <h1>What's on<br><em>right now</em></h1>
    <p id="heroCount">Checking the board…</p>
  </div>
</section>

<section id="controls">
  <div id="days" class="chips" role="group" aria-label="Day"></div>

  <label class="slider">
    <span id="whenLabel">Right now</span>
    <input type="range" id="when" min="-1" max="96" value="-1" step="1" aria-label="Arrival time">
  </label>

  <div id="filters" class="chips" role="group" aria-label="Deal type"></div>

  <!-- Zone and sort are pickers, not chip strips: four scrolling rows of chrome
       pushed the first deal off the screen entirely. -->
  <div id="pickers">
    <label class="pick">
      <span class="visually-hidden">Zone</span>
      <select id="zone"></select>
    </label>
    <label class="pick">
      <span class="visually-hidden">Sort order</span>
      <select id="sort"></select>
    </label>
    <button id="nearMe" class="ghost" type="button">
      <span aria-hidden="true">◎</span> <span id="nearMeLabel">Near me</span>
    </button>
  </div>
</section>

<p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
<main id="feed"></main>

<footer id="credits"></footer>

<template id="cardTpl">
  <article class="card">
    <button class="shot" type="button" aria-label="Open venue details">
      <img class="photo" alt="" loading="lazy" decoding="async" hidden>
      <span class="mono" aria-hidden="true"></span>
      <span class="ends"></span>
      <span class="shotInk">
        <span class="name"></span>
        <span class="zone"></span>
      </span>
    </button>
    <div class="body">
      <ul class="items"></ul>
      <p class="fine"></p>
      <div class="meta">
        <span class="conf"></span>
        <span class="credit"></span>
      </div>
      <div class="actions">
        <a class="btn go map" target="_blank" rel="noopener">Directions</a>
        <a class="btn src" target="_blank" rel="noopener">Source</a>
        <button class="btn wrong" type="button" aria-label="Report this deal as wrong">Wrong?</button>
      </div>
    </div>
  </article>
</template>

<nav id="thumb">
  <button id="nowBtn" type="button">What's on now</button>
  <label id="addBtn" class="btn-photo">
    <input type="file" accept="image/*" capture="environment" id="photo" hidden>
    <span aria-hidden="true">📷</span><span class="lbl">Add a menu</span>
  </label>
</nav>

<dialog id="sheet">
  <div id="sheetBody"></div>
  <button id="sheetClose" type="button">Close</button>
</dialog>

<noscript>
  <p style="padding:20px;color:#a99a89">This page works out what's live right now in your
  browser, so it needs JavaScript switched on.</p>
</noscript>

<script type="module" src="app.js"></script>
</body>
</html>
